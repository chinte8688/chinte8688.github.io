<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>米宝弁当 - 後台管理</title>
<style>
  :root {
    --primary: #2e7d32;
    --primary-light: #4caf50;
    --primary-dark: #1b5e20;
    --accent: #ff6f00;
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #333;
    --text-light: #666;
    --border: #e0e0e0;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 10px;
    --danger: #e53935;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── header ── */
  header {
    background: linear-gradient(135deg,var(--primary-dark),var(--primary));
    color: #fff;
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 1.4rem; letter-spacing: 2px; }
  header .sub { font-size: 0.8rem; opacity: 0.8; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .header-actions button {
    padding: 8px 16px;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.2s;
  }
  .header-actions button:hover { background: rgba(255,255,255,0.25); border-color: #fff; }
  .header-actions button.danger { border-color: #ef5350; color: #ffcdd2; }
  .header-actions button.danger:hover { background: #e53935; color: #fff; }
  .header-actions a {
    padding: 8px 16px;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.2s;
  }
  .header-actions a:hover { background: rgba(255,255,255,0.25); border-color: #fff; }

  /* ── stats cards ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
    gap: 16px;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }
  .stat-card.green::before  { background: var(--primary); }
  .stat-card.orange::before { background: var(--accent); }
  .stat-card.blue::before   { background: #1976d2; }
  .stat-card.red::before    { background: var(--danger); }
  .stat-card.purple::before { background: #7b1fa2; }
  .stat-icon { font-size: 2rem; margin-bottom: 8px; }
  .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--text); }
  .stat-label { font-size: 0.75rem; color: var(--text-light); margin-top: 4px; }

  /* ── tabs ── */
  .tabs {
    display: flex;
    gap: 0;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .tab-btn {
    padding: 10px 20px;
    border: 2px solid var(--primary);
    background: #fff;
    color: var(--primary);
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .tab-btn:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .tab-btn:last-child  { border-radius: 0 var(--radius) var(--radius) 0; }
  .tab-btn:not(:first-child) { border-left: none; }
  .tab-btn.active { background: var(--primary); color: #fff; }

  .tab-content {
    display: none;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }
  .tab-content.active { display: block; }

  /* ── table ── */
  .table-wrap {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  thead { background: var(--primary); color: #fff; }
  th {
    padding: 12px 14px;
    text-align: left;
    font-weight: 600;
    white-space: nowrap;
  }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  tr:hover td { background: #f5faf5; }
  .price { color: var(--accent); font-weight: 700; }
  .empty-row td {
    text-align: center;
    padding: 40px;
    color: var(--text-light);
  }

  /* ── bar chart ── */
  .chart-section {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
  }
  .chart-title {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--primary-dark);
  }
  .bar-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 10px;
  }
  .bar-label {
    min-width: 130px;
    font-size: 0.8rem;
    text-align: right;
    color: var(--text);
  }
  .bar-track {
    flex: 1;
    height: 26px;
    background: #eee;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg,var(--primary-light),var(--primary));
    border-radius: 6px;
    transition: width 0.6s ease;
    min-width: 2px;
  }
  .bar-fill.orange { background: linear-gradient(90deg,#ffb74d,var(--accent)); }
  .bar-fill.blue   { background: linear-gradient(90deg,#64b5f6,#1976d2); }
  .bar-value {
    min-width: 50px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text);
  }

  /* ── filter bar ── */
  .filter-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-bar input, .filter-bar select {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.85rem;
    background: #fff;
  }
  .filter-bar input { width: 180px; }
  .filter-bar select { min-width: 120px; }

  /* ── toast ── */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--primary-dark);
    color: #fff;
    padding: 10px 24px;
    border-radius: 30px;
    font-size: 0.85rem;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 300;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 24px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .modal h2 { color: var(--danger); margin-bottom: 12px; }
  .modal p { color: var(--text-light); margin-bottom: 20px; font-size: 0.9rem; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; }
  .modal-actions button {
    padding: 10px 28px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
  }
  .modal-actions .cancel {
    background: #fff;
    border-color: var(--border);
    color: var(--text);
  }
  .modal-actions .confirm {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
  }
  .modal-actions .confirm:hover { background: #c62828; }

  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    header h1 { font-size: 1.1rem; }
    .stats { grid-template-columns: 1fr 1fr; padding: 12px; gap: 10px; }
    .stat-value { font-size: 1.3rem; }
    .tab-btn { font-size: 0.75rem; padding: 8px 10px; }
    .tab-content { padding: 12px; }
    .bar-label { min-width: 80px; font-size: 0.7rem; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>米宝弁当 後台管理</h1>
    <div class="sub">訂單統計與銷售分析</div>
  </div>
  <div class="header-actions">
    <a href="bento.html">回到點餐頁</a>
    <button onclick="exportCSV()">匯出 CSV</button>
    <button class="danger" onclick="confirmClear()">清除所有資料</button>
  </div>
</header>

<!-- ===== 統計卡片 ===== -->
<div class="stats">
  <div class="stat-card green">
    <div class="stat-icon">📦</div>
    <div class="stat-value" id="totalOrders">0</div>
    <div class="stat-label">總訂單數</div>
  </div>
  <div class="stat-card orange">
    <div class="stat-icon">🍱</div>
    <div class="stat-value" id="totalItems">0</div>
    <div class="stat-label">總便當數量</div>
  </div>
  <div class="stat-card blue">
    <div class="stat-icon">💰</div>
    <div class="stat-value" id="totalRevenue">$0</div>
    <div class="stat-label">總營收</div>
  </div>
  <div class="stat-card purple">
    <div class="stat-icon">📊</div>
    <div class="stat-value" id="avgOrder">$0</div>
    <div class="stat-label">平均客单價</div>
  </div>
  <div class="stat-card red">
    <div class="stat-icon">🔥</div>
    <div class="stat-value" id="peakItem">--</div>
    <div class="stat-label">最暢銷商品</div>
  </div>
</div>

<!-- ===== tabs ===== -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('orders')">訂單明細</button>
  <button class="tab-btn" onclick="switchTab('chart')">銷售排行</button>
  <button class="tab-btn" onclick="switchTab('daily')">每日統計</button>
  <button class="tab-btn" onclick="switchTab('category')">分類統計</button>
</div>

<!-- ===== 訂單明細 ===== -->
<div id="orders" class="tab-content active">
  <div class="filter-bar">
    <input type="date" id="filterDate" onchange="renderOrders()">
    <select id="filterStatus" onchange="renderOrders()">
      <option value="">全部狀態</option>
      <option value="已完成">已完成</option>
      <option value="待處理">待處理</option>
      <option value="已取消">已取消</option>
    </select>
    <input type="text" id="filterSearch" placeholder="搜尋便當名稱..." oninput="renderOrders()">
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>訂單時間</th>
          <th>便當名稱</th>
          <th>主食</th>
          <th>數量</th>
          <th>單價</th>
          <th>小計</th>
          <th>狀態</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="orderBody"></tbody>
    </table>
  </div>
</div>

<!-- ===== 銷售排行 ===== -->
<div id="chart" class="tab-content">
  <div class="chart-section">
    <div class="chart-title">便當銷量排行（前 15 名）</div>
    <div id="salesChart"></div>
  </div>
  <div style="height:20px"></div>
  <div class="chart-section">
    <div class="chart-title">營收貢獻排行（前 15 名）</div>
    <div id="revenueChart"></div>
  </div>
</div>

<!-- ===== 每日統計 ===== -->
<div id="daily" class="tab-content">
  <div class="chart-section">
    <div class="chart-title">每日訂單數與營收</div>
    <div id="dailyChart"></div>
  </div>
</div>

<!-- ===== 分類統計 ===== -->
<div id="category" class="tab-content">
  <div class="chart-section">
    <div class="chart-title">商品分類銷量</div>
    <div id="categoryChart"></div>
  </div>
</div>

<!-- ===== toast ===== -->
<div class="toast" id="toast"></div>

<!-- ===== modal ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>⚠️ 確認清除</h2>
    <p>將刪除所有訂單資料，此操作無法復原。</p>
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">取消</button>
      <button class="confirm" onclick="clearAll()">確定清除</button>
    </div>
  </div>
</div>

<script>
const CATEGORIES = {
  '糙米高纖弁当': '養生系列', '紅豆什穀弁当': '養生系列', '減醣弁当': '養生系列',
  '京醬滷排弁当': '養生系列', '黃金排骨弁当': '養生系列', '碳烤豚肋排弁当': '養生系列',
  '魚排弁当': '養生系列',
  '正宗池上弁当': '特色便當', '懷舊排骨弁当': '特色便當', '雞腿弁当': '特色便當',
  '雞排弁当': '特色便當', '宮保雞丁弁当': '特色便當', '柳葉魚弁当': '特色便當',
  '蒲燒虱目魚弁当': '特色便當', '鰻魚弁当': '特色便當',
  '京醬滷排（單點）': '單點', '黃金排骨（單點）': '單點', '碳烤豚肋排（單點）': '單點',
  '魚排（單點）': '單點', '柳葉魚（單點）': '單點', '蒲燒虱目魚（單點）': '單點',
  '鰻魚（單點）': '單點', '雞排（單點）': '單點', '雞腿（單點）': '單點',
  '新鮮冷泡四季春茶': '飲料', '紅豆飯': '加價', '糙米飯': '加價'
};

function getOrders() {
  try { return JSON.parse(localStorage.getItem('mibau_orders') || '[]'); }
  catch { return []; }
}
function setOrders(orders) {
  localStorage.setItem('mibau_orders', JSON.stringify(orders));
}
function fmtDate(d) {
  const dt = new Date(d);
  const pad = n => String(n).padStart(2,'0');
  return `${dt.getFullYear()}/${pad(dt.getMonth()+1)}/${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}
function switchTab(id) {
  document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
  renderAll();
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function confirmClear() { document.getElementById('modalOverlay').classList.add('open'); }
function clearAll() {
  setOrders([]);
  closeModal();
  renderAll();
  showToast('已清除所有資料');
}

// ── 訂單明細 ──
function renderOrders() {
  const orders = getOrders();
  const dateF = document.getElementById('filterDate').value;
  const statusF = document.getElementById('filterStatus').value;
  const searchF = document.getElementById('filterSearch').value.toLowerCase();
  const tbody = document.getElementById('orderBody');

  const filtered = orders.filter(o => {
    if (dateF && !o.time.startsWith(dateF)) return false;
    if (statusF && o.status !== statusF) return false;
    if (searchF && !o.name.toLowerCase().includes(searchF)) return false;
    return true;
  });

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="8">暫無訂單資料</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map((o, i) => `
    <tr>
      <td>${fmtDate(o.time)}</td>
      <td>${o.name}</td>
      <td>${o.rice || '白飯'}</td>
      <td>${o.qty}</td>
      <td class="price">$${o.unitPrice}</td>
      <td class="price">$${o.unitPrice * o.qty}</td>
      <td>
        <select onchange="changeStatus(${orders.indexOf(o)}, this.value)" style="padding:4px 8px;border-radius:4px;border:1px solid #ccc;font-size:0.8rem;">
          <option value="已完成" ${o.status==='已完成'?'selected':''}>已完成</option>
          <option value="待處理" ${o.status==='待處理'?'selected':''}>待處理</option>
          <option value="已取消" ${o.status==='已取消'?'selected':''}>已取消</option>
        </select>
      </td>
      <td>
        <button onclick="deleteOrder(${orders.indexOf(o)})" style="background:none;border:none;color:#e53935;cursor:pointer;font-size:0.9rem;" title="刪除">🗑</button>
      </td>
    </tr>
  `).join('');
}

function changeStatus(idx, status) {
  const orders = getOrders();
  orders[idx].status = status;
  setOrders(orders);
  renderAll();
  showToast('狀態已更新');
}

function deleteOrder(idx) {
  const orders = getOrders();
  orders.splice(idx, 1);
  setOrders(orders);
  renderAll();
  showToast('已刪除訂單');
}

// ── 統計卡片 ──
function renderStats() {
  const orders = getOrders().filter(o => o.status !== '已取消');
  const totalOrders = orders.length;
  const totalItems = orders.reduce((s,o) => s + o.qty, 0);
  const totalRevenue = orders.reduce((s,o) => s + o.unitPrice * o.qty, 0);
  const avgOrder = totalOrders > 0 ? Math.round(totalRevenue / totalOrders) : 0;

  document.getElementById('totalOrders').textContent = totalOrders;
  document.getElementById('totalItems').textContent = totalItems;
  document.getElementById('totalRevenue').textContent = `$${totalRevenue}`;
  document.getElementById('avgOrder').textContent = `$${avgOrder}`;

  const nameCount = {};
  orders.forEach(o => { nameCount[o.name] = (nameCount[o.name]||0) + o.qty; });
  const peak = Object.entries(nameCount).sort((a,b) => b[1]-a[1])[0];
  document.getElementById('peakItem').textContent = peak ? peak[0] : '--';
}

// ── 銷售排行 ──
function renderSalesChart() {
  const orders = getOrders().filter(o => o.status !== '已取消');
  const nameCount = {};
  orders.forEach(o => { nameCount[o.name] = (nameCount[o.name]||0) + o.qty; });
  const sorted = Object.entries(nameCount).sort((a,b) => b[1]-a[1]).slice(0,15);
  const max = sorted.length > 0 ? sorted[0][1] : 1;
  const container = document.getElementById('salesChart');

  if (sorted.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">暫無資料</div>';
    return;
  }
  container.innerHTML = sorted.map(([name, count]) => `
    <div class="bar-row">
      <span class="bar-label">${name}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(count/max)*100}%"></div></div>
      <span class="bar-value">${count} 份</span>
    </div>
  `).join('');
}

function renderRevenueChart() {
  const orders = getOrders().filter(o => o.status !== '已取消');
  const nameRevenue = {};
  orders.forEach(o => { nameRevenue[o.name] = (nameRevenue[o.name]||0) + o.unitPrice * o.qty; });
  const sorted = Object.entries(nameRevenue).sort((a,b) => b[1]-a[1]).slice(0,15);
  const max = sorted.length > 0 ? sorted[0][1] : 1;
  const container = document.getElementById('revenueChart');

  if (sorted.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">暫無資料</div>';
    return;
  }
  container.innerHTML = sorted.map(([name, rev]) => `
    <div class="bar-row">
      <span class="bar-label">${name}</span>
      <div class="bar-track"><div class="bar-fill orange" style="width:${(rev/max)*100}%"></div></div>
      <span class="bar-value">$${rev}</span>
    </div>
  `).join('');
}

// ── 每日統計 ──
function renderDailyChart() {
  const orders = getOrders().filter(o => o.status !== '已取消');
  const dayMap = {};
  orders.forEach(o => {
    const d = o.time.slice(0,10);
    if (!dayMap[d]) dayMap[d] = { count:0, revenue:0 };
    dayMap[d].count += o.qty;
    dayMap[d].revenue += o.unitPrice * o.qty;
  });
  const sorted = Object.entries(dayMap).sort((a,b) => a[0].localeCompare(b[0])).slice(-14);
  const maxR = sorted.length > 0 ? Math.max(...sorted.map(d=>d[1].revenue)) : 1;
  const maxC = sorted.length > 0 ? Math.max(...sorted.map(d=>d[1].count)) : 1;
  const container = document.getElementById('dailyChart');

  if (sorted.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">暫無資料</div>';
    return;
  }
  container.innerHTML = sorted.map(([date, data]) => `
    <div class="bar-row">
      <span class="bar-label">${date.slice(5)}</span>
      <div class="bar-track"><div class="bar-fill blue" style="width:${(data.revenue/maxR)*100}%"></div></div>
      <span class="bar-value">$${data.revenue} / ${data.count}份</span>
    </div>
  `).join('');
}

// ── 分類統計 ──
function renderCategoryChart() {
  const orders = getOrders().filter(o => o.status !== '已取消');
  const catCount = {};
  orders.forEach(o => {
    const cat = CATEGORIES[o.name] || '其他';
    catCount[cat] = (catCount[cat]||0) + o.qty;
  });
  const sorted = Object.entries(catCount).sort((a,b) => b[1]-a[1]);
  const max = sorted.length > 0 ? sorted[0][1] : 1;
  const container = document.getElementById('categoryChart');
  const colors = ['green','orange','blue','',''];

  if (sorted.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">暫無資料</div>';
    return;
  }
  container.innerHTML = sorted.map(([cat, count], i) => `
    <div class="bar-row">
      <span class="bar-label">${cat}</span>
      <div class="bar-track"><div class="bar-fill ${colors[i%colors.length]}" style="width:${(count/max)*100}%"></div></div>
      <span class="bar-value">${count} 份</span>
    </div>
  `).join('');
}

// ── 匯出 CSV ──
function exportCSV() {
  const orders = getOrders();
  if (orders.length === 0) { showToast('暫無資料可匯出'); return; }
  const header = '訂單時間,便當名稱,主食,數量,單價,小計,狀態\n';
  const rows = orders.map(o =>
    `${fmtDate(o.time)},${o.name},${o.rice||'白飯'},${o.qty},${o.unitPrice},${o.unitPrice*o.qty},${o.status}`
  ).join('\n');
  const bom = '\uFEFF';
  const blob = new Blob([bom + header + rows], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `米宝弁当_訂單_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV 已匯出');
}

// ── render all ──
function renderAll() {
  renderStats();
  renderOrders();
  renderSalesChart();
  renderRevenueChart();
  renderDailyChart();
  renderCategoryChart();
}

renderAll();
</script>
